name: Atualizar radar politico
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar
        run: python -m unittest discover -s tests
      - name: Coletar noticias
        run: python collector.py
      - name: Publicar boletim
        run: |
          git config user.name "radar-politico-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/latest.json
          git diff --cached --quiet || git commit -m "Atualiza radar politico"
          git push
